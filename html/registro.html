<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Registro · MateBeat</title>
    <meta name="description" content="Registrate en MateBeat.">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <main>

        <section>

            <img src="../assets/logo_m8beat.png" alt="MateBeat, Música y amigos" width="200" height="200">
            <h1>Crear cuenta</h1>
            <p>Únete a MateBeat para compartir tu música</p>

            <form action="menuPrincipal.html" method="get">
                <label for="registro-usuario">Email/usuario</label>
                <input type="text" name="usuario" id="registro-usuario" placeholder="tucorreo@gmail.com" autocomplete="username">

                <label for="registro-password">Contraseña</label>
                <input type="text" name="password" id="registro-password" placeholder="••••••••••" autocomplete="new-password">
            
                <button type="submit">¡Vamos!</button>
            </form>

            <p>¿Ya tienes cuenta? <a href="inicioSesion.html">Inicia sesión</a></p>

        </section>

    </main>
</body>
</html>
