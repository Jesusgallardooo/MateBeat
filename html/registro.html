<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Registro · MateBeat</title>
    <meta name="description" content="Registrate en MateBeat.">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <main>

        <section>

            <img src="../assets/logo_m8beat.png" alt="MateBeat, Música y amigos" width="200" height="200">
            <h1>Crear cuenta</h1>
            <p>Únete a MateBeat para compartir tu música</p>

            <form action="menuPrincipal.html" method="get" novalidate>
                <label for="registro-usuario">Nombre de usuario</label>
                <input type="text" name="usuario" id="registro-usuario" placeholder="pacopepe" autocomplete="username">
                <span id="error-usuario"></span>

                <label for="registro-email">Correo electrónico</label>
                <input type="email" name="email" id="registro-email" placeholder="tucorreo@gmail.com" autocomplete="email@mismo.com">
                <span id="error-email"></span>

                <label for="registro-password">Contraseña</label>
                <input type="password" name="password" id="registro-password" placeholder="••••••••••" autocomplete="new-password">
                <span id="error-password"></span>

                <label for="registro-repetir-password">Repetir contraseña</label>
                <input type="password" name="repetirPassword" id="registro-repetir-password" placeholder="••••••••••" autocomplete="new-password">
                <span id="error-repetir-password"></span>

                <label for="registro-fecha">Fecha de nacimiento</label>
                <input type="date" name="fechaNacimiento" id="registro-fecha">
                <span id="error-fecha"></span>

                <label for="registro-condiciones">
                    <input type="checkbox" name="condiciones" id="registro-condiciones">
                    Acepto las condiciones de uso
                </label>
                <span id="error-condiciones"></span>
            
                <button type="submit">¡Vamos!</button>
            </form>

            <p>¿Ya tienes cuenta? <a href="inicioSesion.html">Inicia sesión</a></p>

        </section>

    </main>

    <script type="module" src="../js/main.js"></script>
</body>
</html>
